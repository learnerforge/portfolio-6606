<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232563eb'/%3E%3Cstop offset='0.5' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='26' font-weight='700' text-anchor='middle' fill='%23ffffff'%3EGB%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07070f" />
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem('portfolio.theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>

    <!-- SEO Meta Tags -->
    <title>Ganesh Bakkera | AI & ML Engineer · Full Stack Developer</title>
    <meta name="description" content="Portfolio of Ganesh Bakkera — AI/ML Engineer and Full Stack Developer building AI-powered products and full-stack systems with Python, FastAPI, React and PostgreSQL." />
    <meta name="keywords" content="Ganesh Bakkera, AI Engineer, Machine Learning, Full Stack Developer, Python, FastAPI, Vue, Three.js, LLM, NLP" />
    <meta name="author" content="Ganesh Bakkera" />
    <meta property="og:title" content="Ganesh Bakkera | AI & ML Engineer" />
    <meta property="og:description" content="AI/ML and full-stack engineering portfolio — from specification to deployment." />
    <meta property="og:type" content="website" />

    <style>
      html, body { margin: 0; padding: 0; }
      html { background: #07070f; }
      html[data-theme='light'] { background: #f6f7fb; }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        background: #07070f;
        color: #f3f1ff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", sans-serif;
        transition: opacity .8s ease, transform .8s ease;
      }
      html[data-theme='light'] #boot {
        background: #f6f7fb;
        color: #14152a;
      }
      #boot .boot-wrap { display: flex; flex-direction: column; align-items: center; }
      #boot .boot-ring {
        position: relative;
        width: 60px;
        height: 60px;
        margin-bottom: 24px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.12);
      }
      html[data-theme='light'] #boot .boot-ring { border-color: rgba(20, 21, 42, 0.12); }
      #boot .boot-ring::before {
        content: '';
        position: absolute;
        inset: -2px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #38bdf8;
        border-right-color: #e879f9;
        animation: bootspin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      html[data-theme='light'] #boot .boot-ring::before {
        border-top-color: #6c3ef7;
        border-right-color: #ec4899;
      }
      #boot .boot-core {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-weight: 600;
        font-size: 13px;
      }
      #boot span {
        font-size: 11px;
        letter-spacing: 0.12em;
        color: #686a96;
        text-transform: lowercase;
      }
      html[data-theme='light'] #boot span { color: #7c7fa6; }
      @keyframes bootspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="boot-wrap">
        <div class="boot-ring"><div class="boot-core">GB</div></div>
        <span>loading…</span>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
