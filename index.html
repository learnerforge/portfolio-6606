    <style>
      html, body { margin: 0; padding: 0; background: #f8f9fc; }
      #boot { position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; background: #f8f9fc; }
      #boot .boot-wrap { display: flex; flex-direction: column; align-items: center; }
      #boot .boot-orb { position: relative; width: 76px; height: 76px; margin-bottom: 26px; }
      #boot .boot-ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(8, 145, 178, 0.22); }
      #boot .boot-ring::before { content: ''; position: absolute; inset: 9px; border-radius: 50%; border: 1px dashed rgba(192, 38, 211, 0.35); animation: bootspin 7s linear infinite; }
      #boot .boot-ring::after { content: ''; position: absolute; inset: -7px; border-radius: 50%; border: 1px solid transparent; border-top-color: #0891b2; border-right-color: rgba(192, 38, 211, 0.5); animation: bootspin 1.3s linear infinite; }
      #boot .boot-orbit { position: absolute; inset: -7px; animation: bootspin 2.1s linear infinite; }
      #boot .boot-dot { position: absolute; top: 50%; left: 0; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #0891b2; box-shadow: 0 0 12px #0891b2; }
      #boot .boot-dot + .boot-dot { left: auto; right: 0; margin: -3px -3px 0 0; background: #c026d3; box-shadow: 0 0 12px #c026d3; }
      #boot .boot-core { position: absolute; inset: 21px; display: grid; place-items: center; border-radius: 50%; font-family: 'Sora', sans-serif; font-weight: 700; font-size: 12px; color: #1a1a2e; background: radial-gradient(circle at 30% 30%, #e8e9f0, #dde0ea); box-shadow: 0 0 26px rgba(8, 145, 178, 0.15); animation: bootpulse 1.6s ease-in-out infinite; }
      #boot span { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.32em; color: #9a9ab0; }
      @keyframes bootspin { to { transform: rotate(360deg); } }
      @keyframes bootpulse { 0%, 100% { opacity: 0.6 } 50% { opacity: 1 } }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="boot-wrap">
        <div class="boot-orb">
          <div class="boot-ring"></div>
          <div class="boot-orbit"><span class="boot-dot"></span><span class="boot-dot"></span></div>
          <div class="boot-core">GB</div>
        </div>
        <span>INITIALIZING&nbsp;SCENE</span>
      </div>
    </div>
